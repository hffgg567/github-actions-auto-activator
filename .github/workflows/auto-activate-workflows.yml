name: Auto-Activate Paused Workflows (Multi-Repo)

# ============================================================
# 跨仓库批量激活「已停用超过阈值(默认60天/2个月)」的 Actions 工作流
#
# 触发方式：
#   - 每 12 小时自动运行一次 (schedule)
#   - 手动运行并自定义参数 (workflow_dispatch)
#
# 鉴权：
#   - 单仓库(仅当前仓库)：使用内置 GITHUB_TOKEN 即可
#   - 跨仓库：需要一个对所有目标仓库都有 repo 权限的 PAT，
#             存入 Secrets 的 BATCH_TOKEN
# ============================================================

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: "目标仓库列表(每行 owner/repo)。留空=仅当前仓库"
        required: false
        default: ""
      paused_threshold_days:
        description: "停用天数阈值，超过才激活(默认60)"
        required: false
        default: "60"
      dry_run:
        description: "只报告不实际激活"
        type: boolean
        required: false
        default: false
      token:
        description: "跨仓库使用的 PAT(留空则用内置 GITHUB_TOKEN)"
        required: false
        default: ""

permissions:
  actions: write

jobs:
  batch-activate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve token & repos
        id: prep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TOKEN: ${{ inputs.token }}
          BATCH_TOKEN: ${{ secrets.BATCH_TOKEN }}
          INPUT_REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          # token 优先级：手动输入 > BATCH_TOKEN secret > 内置 GITHUB_TOKEN
          TOKEN="${INPUT_TOKEN:-${BATCH_TOKEN:-$GITHUB_TOKEN}}"
          if [ -z "$TOKEN" ]; then
            echo "❌ 没有可用的 token"; exit 1
          fi
          {
            echo "token=$TOKEN"
            echo "input_repos=${INPUT_REPOS:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Find & activate paused workflows
        env:
          GH_TOKEN: ${{ steps.prep.outputs.token }}
          INPUT_REPOS: ${{ steps.prep.outputs.input_repos }}
          GH_REPOSITORY: ${{ github.repository }}
          THRESHOLD_DAYS: ${{ inputs.paused_threshold_days || 60 }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          python3 <<'PYEOF'
          import json, os, sys, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          token       = os.environ["GH_TOKEN"]
          cur_repo    = os.environ["GH_REPOSITORY"]
          input_repos = (os.environ.get("INPUT_REPOS") or "").strip()
          threshold   = int(os.environ.get("THRESHOLD_DAYS", "60"))
          dry_run     = os.environ.get("DRY_RUN", "false").lower() == "true"

          def headers():
              return {"Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json"}

          def get(url):
              req = urllib.request.Request(url, headers=headers())
              return json.load(urllib.request.urlopen(req))

          def get_all_workflows(repo):
              """拉取某仓库全部工作流(处理分页)"""
              url = f"https://api.github.com/repos/{repo}/actions/workflows?per_page=100"
              data = get(url)
              out = list(data.get("workflows", []))
              while "next" in data.get("links", {}):
                  data = get(data["links"]["next"])
                  out.extend(data.get("workflows", []))
              return out

          # 目标仓库列表：手动输入优先，否则仅当前仓库
          if input_repos:
              repos = [r.strip() for r in input_repos.splitlines() if r.strip()]
          else:
              repos = [cur_repo]

          # GitHub 会把 60 天未活动的工作流自动标记为 disabled_inactivity；只激活这一类
          PAUSED_STATES = {"disabled_inactivity"}
          now = datetime.now(timezone.utc)

          total = activated = skipped_undated = skipped_recent = failed = 0
          print(f"📦 目标仓库: {', '.join(repos)}")
          print(f"⏱  阈值: 停用 > {threshold} 天     DRY_RUN={dry_run}\n")
          print("=" * 70)

          for repo in repos:
              print(f"\n### 仓库 {repo}")
              try:
                  workflows = get_all_workflows(repo)
              except urllib.error.HTTPError as e:
                  print(f"  ❌ 无法访问该仓库 ({e.code}: {e.reason})，请确认 token 有权限")
                  failed += 1
                  continue

              total += len(workflows)
              repo_hit = 0
              for wf in workflows:
                  state = wf.get("state", "")
                  if state not in PAUSED_STATES:
                      continue
                  name = wf.get("name", wf.get("path", "?"))
                  # 判定停用时长：用工作流 updated_at 近似“最后变更/停用时间”
                  updated = wf.get("updated_at") or wf.get("created_at")
                  if not updated:
                      print(f"  ⚠️  {name}: 缺少时间戳，跳过")
                      skipped_undated += 1
                      continue
                  paused_days = (now - datetime.fromisoformat(updated.replace("Z", "+00:00"))).days
                  mark = "已暂停" if paused_days > threshold else "近期暂停"
                  print(f"  ⏸  {name}  |  {mark} ({paused_days}天, 更新于 {updated})")
                  repo_hit += 1
                  if paused_days <= threshold:
                      # 停用时间不长，默认不动(避免误激活刚暂停的)
                      skipped_recent += 1
                      continue
                  if dry_run:
                      print(f"       [DRY-RUN] 将激活")
                      continue
                  try:
                      req = urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/actions/workflows/{wf['id']}/enable",
                          method="PUT", headers=headers())
                      urllib.request.urlopen(req)
                      print(f"       ✅ 已激活")
                      activated += 1
                  except urllib.error.HTTPError as e:
                      print(f"       ❌ 激活失败 ({e.code}: {e.reason})")
                      failed += 1
              if repo_hit == 0:
                  print("  （无符合条件的暂停工作流）")

          # 汇总
          print("\n" + "=" * 70)
          print(f"📊 汇总: 扫描工作流 {total} | 激活 {activated} | "
                f"近期跳过 {skipped_recent} | 无时间戳 {skipped_undated} | 失败 {failed}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary:
              with open(summary, "a") as f:
                  f.write(f"### 多仓库工作流激活报告\n")
                  f.write(f"- 目标仓库: {', '.join(repos)}\n")
                  f.write(f"- 阈值: {threshold} 天, DRY_RUN={dry_run}\n")
                  f.write(f"- 扫描工作流: {total}\n")
                  f.write(f"- 成功激活: {activated}\n")
                  f.write(f"- 近期暂停(跳过): {skipped_recent}\n")
                  f.write(f"- 无时间戳(跳过): {skipped_undated}\n")
                  f.write(f"- 失败: {failed}\n")
          PYEOF
